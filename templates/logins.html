<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · College Management</title>

    <!-- Original CSS/JS links preserved -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Professional Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
            background: #eef2f7;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, #d5dce6 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, #c8d0d9 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 20%, #e8edf5 0%, transparent 50%);
            z-index: -1;
            animation: gradientShift 20s ease-in-out infinite alternate;
        }

        @keyframes gradientShift {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(2%, 1%) rotate(2deg); }
            100% { transform: translate(-1%, -1%) rotate(-2deg); }
        }

        /* ===== CONTAINER ===== */
        .container {
            max-width: 460px;
            width: 100%;
            padding: 0;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .row.justify-content-center {
            margin: 0;
        }

        .col-md-6 {
            flex: 0 0 100%;
            max-width: 100%;
            padding: 0;
        }

        /* ===== LOGIN CARD ===== */
        .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 36px;
            padding: 44px 40px 48px 40px;
            box-shadow:
                0 30px 80px -20px rgba(0, 20, 40, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s ease;
        }

        .login-card:hover {
            box-shadow:
                0 40px 100px -20px rgba(0, 20, 40, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.6);
        }

        /* ===== HEADER ===== */
        .login-header {
            text-align: center;
            margin-bottom: 34px;
        }

        .login-header .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 76px;
            height: 76px;
            background: linear-gradient(145deg, #1a2a3a, #2c3e50);
            border-radius: 60px;
            margin-bottom: 18px;
            box-shadow: 0 10px 30px rgba(44, 62, 80, 0.2);
            transition: all 0.4s ease;
        }

        .login-header .icon-wrapper:hover {
            transform: scale(1.05) rotate(-2deg);
            box-shadow: 0 14px 40px rgba(44, 62, 80, 0.25);
        }

        .login-header .icon-wrapper i {
            font-size: 34px;
            color: white;
            transition: transform 0.4s ease;
        }

        .login-header .icon-wrapper:hover i {
            transform: scale(1.1);
        }

        .login-header h2 {
            font-size: 30px;
            font-weight: 700;
            color: #1a2a3a;
            letter-spacing: -0.6px;
            margin: 0;
        }

        .login-header .subtitle {
            color: #6c7a8a;
            font-size: 15px;
            font-weight: 400;
            margin-top: 6px;
            letter-spacing: -0.1px;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
            color: #1a2a3a;
            margin-bottom: 6px;
            display: block;
            letter-spacing: -0.1px;
        }

        .form-group label .required-star {
            color: #dc3545;
            margin-left: 2px;
        }

        .form-control {
            border-radius: 14px;
            padding: 13px 18px;
            font-size: 15px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            transition: all 0.3s ease;
            color: #1a2a3a;
            font-weight: 500;
            height: 54px;
            width: 100%;
        }

        .form-control:hover {
            background: #ffffff;
            border-color: #c8d0d9;
        }

        .form-control:focus {
            border-color: #2c3e50;
            box-shadow: 0 0 0 4px rgba(44, 62, 80, 0.08);
            background: #ffffff;
            outline: none;
        }

        .form-control::placeholder {
            color: #94a3b8;
            font-weight: 400;
            font-size: 14px;
        }

        /* ===== PASSWORD TOGGLE ===== */
        .input-group {
            position: relative;
            display: flex;
            align-items: stretch;
        }

        .input-group .form-control {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            border-right: none;
        }

        .input-group .form-control:focus {
            border-right: none;
        }

        .input-group .btn-outline-secondary {
            border-top-right-radius: 14px;
            border-bottom-right-radius: 14px;
            border: 1.5px solid #e2e8f0;
            border-left: none;
            background: #f8fafc;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            transition: all 0.3s ease;
            height: 54px;
        }

        .input-group .btn-outline-secondary:hover {
            background: #eef2f7;
            color: #1a2a3a;
            border-color: #c8d0d9;
        }

        .input-group .btn-outline-secondary:focus {
            box-shadow: none;
            outline: none;
        }

        .input-group .btn-outline-secondary i {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .input-group .btn-outline-secondary:hover i {
            transform: scale(1.1);
        }

        /* ===== SUBMIT BUTTON ===== */
        .btn-primary {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            background: linear-gradient(145deg, #1a2a3a, #2c3e50);
            border: none;
            color: white;
            transition: all 0.35s ease;
            letter-spacing: 0.4px;
            box-shadow: 0 6px 24px rgba(44, 62, 80, 0.2);
            margin-top: 6px;
            height: 56px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(44, 62, 80, 0.3);
            background: linear-gradient(145deg, #0f1a2a, #1a2a3a);
        }

        .btn-primary:hover::after {
            opacity: 1;
        }

        .btn-primary:active {
            transform: scale(0.97);
            box-shadow: 0 4px 16px rgba(44, 62, 80, 0.15);
        }

        /* ===== FORGOT PASSWORD ===== */
        .forgot-link {
            text-align: center;
            margin-top: 22px;
        }

        .forgot-link a {
            color: #6c7a8a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            letter-spacing: -0.1px;
            padding: 8px 16px;
            border-radius: 10px;
            display: inline-block;
        }

        .forgot-link a:hover {
            color: #1a2a3a;
            background: rgba(0, 0, 0, 0.03);
            transform: translateY(-1px);
        }

        .forgot-link a i {
            margin-right: 6px;
            font-size: 14px;
        }

        /* ===== ALERTS ===== */
        .alert {
            border-radius: 16px;
            border: none;
            padding: 14px 22px;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            border-left: 5px solid #2c3e50;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.alert-danger {
            border-left-color: #dc3545;
            background: rgba(254, 242, 242, 0.98);
            color: #991b1b;
        }

        .alert.alert-success {
            border-left-color: #28a745;
            background: rgba(240, 253, 244, 0.98);
            color: #166534;
        }

        .alert.alert-warning {
            border-left-color: #ffc107;
            background: rgba(255, 248, 235, 0.98);
            color: #856404;
        }

        .alert .btn-close {
            background-size: 0.7rem;
            padding: 0.4rem;
            opacity: 0.4;
            filter: none;
            margin-left: 12px;
            transition: opacity 0.3s ease;
        }

        .alert .btn-close:hover {
            opacity: 0.8;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 576px) {
            .login-card {
                padding: 30px 22px 34px 22px;
                border-radius: 28px;
            }

            .login-header h2 {
                font-size: 24px;
            }

            .login-header .icon-wrapper {
                width: 62px;
                height: 62px;
            }

            .login-header .icon-wrapper i {
                font-size: 28px;
            }

            .login-header .subtitle {
                font-size: 13px;
            }

            .form-control {
                height: 48px;
                padding: 11px 16px;
                font-size: 14px;
            }

            .input-group .btn-outline-secondary {
                height: 48px;
                padding: 0 14px;
            }

            .btn-primary {
                height: 48px;
                font-size: 15px;
                padding: 13px;
            }

            .alert {
                font-size: 13px;
                padding: 12px 18px;
                border-radius: 14px;
            }
        }

        @media (max-width: 400px) {
            .login-card {
                padding: 24px 16px 28px 16px;
                border-radius: 24px;
            }

            .login-header h2 {
                font-size: 20px;
            }

            .login-header .icon-wrapper {
                width: 54px;
                height: 54px;
            }

            .login-header .icon-wrapper i {
                font-size: 24px;
            }

            .form-group label {
                font-size: 13px;
            }

            .form-control {
                font-size: 13px;
                height: 44px;
                padding: 10px 14px;
            }

            .input-group .btn-outline-secondary {
                height: 44px;
                padding: 0 12px;
            }

            .btn-primary {
                height: 44px;
                font-size: 14px;
                padding: 11px;
            }

            .forgot-link a {
                font-size: 13px;
                padding: 6px 12px;
            }
        }

        /* ===== UTILITY ===== */
        .mt-3 {
            margin-top: 1rem !important;
        }

        .text-center {
            text-align: center !important;
        }
    </style>
</head>
<body>

    <!-- ===== MESSAGES (unchanged functionality) ===== -->
    {% if messages %}
        {% for foo in messages %}
            <div class="alert {% if foo.tags == "error" %}alert-danger {% else %}alert-{{ foo.tags }}{% endif %} alert-dismissible" role="alert" style="position:fixed; top:20px; left:50%; transform:translateX(-50%); max-width:460px; width:90%; z-index:9999;">
                <span>{{ foo.message }}</span>
                <button class="btn btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    <!-- ===== LOGIN FORM ===== -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="login-card">

                    <!-- Header -->
                    <div class="login-header">
                        <div class="icon-wrapper">
                            <i class="bi bi-mortarboard-fill"></i>
                        </div>
                        <h2>Welcome Back</h2>
                        <p class="subtitle">Sign in to your account</p>
                    </div>

                    <!-- Form (all original attributes preserved) -->
                    <form method="post" enctype="multipart/form-data" action="/myapp/logins_post">
                        {% csrf_token %}

                        <div class="form-group">
                            <label for="username">
                                Username <span class="required-star">*</span>
                            </label>
                            <input type="text" class="form-control" name="username" id="username" placeholder="Enter your username" required>
                        </div>

                        <div class="form-group">
                            <label for="password">
                                Password <span class="required-star">*</span>
                            </label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()" aria-label="Toggle password visibility">
                                    <i class="bi bi-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary">
                            <i class="bi bi-box-arrow-in-right" style="margin-right: 8px;"></i>
                            Sign In
                        </button>
                    </form>

                    <!-- Forgot Password -->
                    <div class="forgot-link">
                        <a href="/myapp/forgotpassword">
                            <i class="bi bi-key"></i> Forgot Password?
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- ===== ORIGINAL SCRIPTS (unchanged) ===== -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- ===== PASSWORD TOGGLE (original function, unchanged) ===== -->
    <script>
        function togglePassword() {
            var password = document.getElementById("password");
            var eyeIcon = document.getElementById("eyeIcon");

            if (password.type === "password") {
                password.type = "text";
                eyeIcon.classList.remove("bi-eye");
                eyeIcon.classList.add("bi-eye-slash");
            } else {
                password.type = "password";
                eyeIcon.classList.remove("bi-eye-slash");
                eyeIcon.classList.add("bi-eye");
            }
        }
    </script>

</body>
</html>
