{% extends 'Hod/dashboard.html' %}
{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Subject</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* ===== PAGE STYLES ===== */
        .subject-wrapper {
            padding: 10px 0 30px 0;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .page-header .header-left .icon-circle {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #2c3e50, #1a2a3a);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(44, 62, 80, 0.2);
        }

        .page-header .header-left .icon-circle i {
            font-size: 26px;
            color: white;
        }

        .page-header .header-left .header-text h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a2a3a;
            margin: 0;
            letter-spacing: -0.3px;
        }

        .page-header .header-left .header-text .subtitle {
            font-size: 14px;
            color: #6c757d;
            margin: 0;
        }

        /* ===== FORM CARD ===== */
        .form-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
            overflow: hidden;
            max-width: 780px;
            margin: 0 auto;
            transition: box-shadow 0.3s ease;
        }

        .form-card:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        .form-card .card-header {
            padding: 18px 28px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .form-card .card-header .card-title {
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-card .card-header .card-title i {
            color: #2c3e50;
            font-size: 20px;
        }

        .form-card .card-header .card-title .badge-edit {
            background: #ffc107;
            color: #2c3e50;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .form-card .card-header .timestamp {
            font-size: 13px;
            color: #6c757d;
        }

        .form-card .card-header .timestamp i {
            margin-right: 5px;
        }

        .form-card .card-body {
            padding: 32px 34px 34px 34px;
        }

        /* ===== FORM STYLES ===== */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 6px;
            display: block;
        }

        .form-group label .required {
            color: #dc3545;
            margin-left: 3px;
        }

        .form-group .form-control,
        .form-group .form-select {
            border-radius: 12px;
            padding: 11px 18px;
            font-size: 14px;
            border: 1.5px solid #dee2e6;
            background: #fafbfc;
            transition: all 0.3s ease;
            color: #2c3e50;
            height: 48px;
            width: 100%;
        }

        .form-group .form-control:hover,
        .form-group .form-select:hover {
            background: #ffffff;
            border-color: #c8d0d9;
        }

        .form-group .form-control:focus,
        .form-group .form-select:focus {
            border-color: #2c3e50;
            box-shadow: 0 0 0 4px rgba(44, 62, 80, 0.08);
            background: #ffffff;
            outline: none;
        }

        .form-group .form-control::placeholder {
            color: #adb5bd;
            font-size: 13px;
        }

        /* ===== TEXTAREA STYLES ===== */
        .form-group .form-control.textarea {
            height: auto;
            min-height: 120px;
            resize: vertical;
            padding: 12px 18px;
            line-height: 1.6;
        }

        /* ===== FORM ICONS ===== */
        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper .form-control,
        .input-icon-wrapper .form-select {
            padding-left: 46px;
        }

        .input-icon-wrapper .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 19px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .input-icon-wrapper .form-control.textarea ~ .input-icon {
            top: 22px;
            transform: none;
        }

        .input-icon-wrapper .form-control:focus ~ .input-icon,
        .input-icon-wrapper .form-select:focus ~ .input-icon {
            color: #2c3e50;
        }

        /* ===== SELECT ARROW CUSTOM ===== */
        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%236c757d' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 14px;
            padding-right: 40px;
            cursor: pointer;
        }

        .form-select:hover {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%232c3e50' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
        }

        /* ===== SUBMIT BUTTON ===== */
        .btn-submit {
            padding: 14px 48px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            background: linear-gradient(145deg, #ffc107, #e0a800);
            color: #2c3e50;
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 16px rgba(255, 193, 7, 0.3);
        }

        .btn-submit:hover {
            background: linear-gradient(145deg, #e0a800, #c99500);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(255, 193, 7, 0.4);
        }

        .btn-submit:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(255, 193, 7, 0.2);
        }

        .btn-submit i {
            font-size: 20px;
        }

        /* ===== BUTTON CENTER ===== */
        .button-center {
            text-align: center;
            margin-top: 10px;
            padding-top: 6px;
        }

        /* ===== DIVIDER ===== */
        .form-divider {
            border: none;
            border-top: 1px solid #e9ecef;
            margin: 20px 0 24px 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .form-card .card-body {
                padding: 22px 20px 26px 20px;
            }

            .form-card .card-header {
                padding: 14px 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header .header-left .header-text h2 {
                font-size: 20px;
            }

            .page-header .header-left .icon-circle {
                width: 44px;
                height: 44px;
            }

            .page-header .header-left .icon-circle i {
                font-size: 22px;
            }

            .btn-submit {
                width: 100%;
                justify-content: center;
                padding: 13px 24px;
                font-size: 15px;
            }

            .form-group .form-control,
            .form-group .form-select {
                height: 44px;
                font-size: 13px;
                padding: 9px 16px;
            }

            .form-group .form-control.textarea {
                min-height: 100px;
            }

            .form-group label {
                font-size: 13px;
            }

            .input-icon-wrapper .form-control,
            .input-icon-wrapper .form-select {
                padding-left: 42px;
            }

            .input-icon-wrapper .input-icon {
                font-size: 17px;
                left: 14px;
            }

            .form-card .card-header .card-title {
                font-size: 14px;
            }
        }

        @media (max-width: 576px) {
            .form-card .card-body {
                padding: 18px 16px 22px 16px;
            }

            .form-card .card-header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
            }

            .form-group .form-control,
            .form-group .form-select {
                height: 40px;
                font-size: 12px;
                padding: 7px 14px;
                border-radius: 10px;
            }

            .form-group .form-control.textarea {
                min-height: 90px;
                padding: 10px 14px;
            }

            .btn-submit {
                font-size: 14px;
                padding: 11px 20px;
            }

            .input-icon-wrapper .form-control,
            .input-icon-wrapper .form-select {
                padding-left: 38px;
            }

            .input-icon-wrapper .input-icon {
                font-size: 15px;
                left: 12px;
            }

            .page-header .header-left .header-text h2 {
                font-size: 18px;
            }

            .page-header .header-left .icon-circle {
                width: 38px;
                height: 38px;
            }

            .page-header .header-left .icon-circle i {
                font-size: 18px;
            }

            .form-card .card-header .timestamp {
                font-size: 11px;
            }
        }

        /* ===== VALIDATION STYLES ===== */
        .form-control:invalid:not(:placeholder-shown) {
            border-color: #dc3545;
        }

        .form-control:invalid:not(:placeholder-shown):focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.08);
        }

        .form-control:valid:not(:placeholder-shown) {
            border-color: #28a745;
        }

        .form-control:valid:not(:placeholder-shown):focus {
            border-color: #28a745;
            box-shadow: 0 0 0 4px rgba(40, 167, 69, 0.08);
        }
    </style>
</head>
<body>

<div class="subject-wrapper">

    <!-- ===== PAGE HEADER ===== -->
    <div class="page-header">
        <div class="header-left">
            <div class="icon-circle">
                <i class="bi bi-pencil-square"></i>
            </div>
            <div class="header-text">
                <h2>Edit Subject</h2>
                <p class="subtitle">Update subject information</p>
            </div>
        </div>
    </div>

    <!-- ===== FORM CARD ===== -->
    <div class="form-card">
        <div class="card-header">
            <div class="card-title">
                <i class="bi bi-pencil-square"></i>
                Edit Subject
                <span class="badge-edit">EDIT MODE</span>
            </div>
            <div class="timestamp">
                <i class="bi bi-clock"></i>
                {% now "d M Y, h:i A" %}
            </div>
        </div>

        <div class="card-body">
            <form method="post" enctype="multipart/form-data" action="/myapp/edit_subject_post">
                {% csrf_token %}
                <input type="hidden" name="id" value="{{ data.id }}">

                <!-- Subject Name -->
                <div class="form-group">
                    <label for="sub_name">
                        <i class="bi bi-bookmark" style="margin-right: 6px;"></i>
                        Subject Name <span class="required">*</span>
                    </label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-bookmark input-icon"></i>
                        <input type="text" class="form-control" name="sub_name" 
                               placeholder="Enter subject name" 
                               required
                               oninvalid="this.setCustomValidity('Please enter subject name')"
                               oninput="this.setCustomValidity('')" 
                               value="{{ data.sub_name }}">
                    </div>
                </div>

                <!-- Subject Details -->
                <div class="form-group">
                    <label for="sub_details">
                        <i class="bi bi-file-text" style="margin-right: 6px;"></i>
                        Subject Details <span class="required">*</span>
                    </label>
                    <div class="input-icon-wrapper">
                        <textarea name="sub_details" class="form-control textarea"
                                  rows="5" 
                                  placeholder="Enter subject description, syllabus, or other details"
                                  required
                                  oninvalid="this.setCustomValidity('Please enter subject details')"
                                  oninput="this.setCustomValidity('')">{{ data.sub_details }}</textarea>
                    </div>
                </div>

                <!-- Semester -->
                <div class="form-group">
                    <label for="semester">
                        <i class="bi bi-grid-3x3-gap-fill" style="margin-right: 6px;"></i>
                        Semester <span class="required">*</span>
                    </label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-grid-3x3-gap-fill input-icon"></i>
                        <select name="semester" id="semester" class="form-select" required>
                            <option value="">Select Semester</option>
                            <option value="1" {% if data.semester == "1" %}selected{% endif %}>1</option>
                            <option value="2" {% if data.semester == "2" %}selected{% endif %}>2</option>
                            <option value="3" {% if data.semester == "3" %}selected{% endif %}>3</option>
                            <option value="4" {% if data.semester == "4" %}selected{% endif %}>4</option>
                            <option value="5" {% if data.semester == "5" %}selected{% endif %}>5</option>
                            <option value="6" {% if data.semester == "6" %}selected{% endif %}>6</option>
                        </select>
                    </div>
                </div>

                <!-- Course Name -->
                <div class="form-group">
                    <label for="course">
                        <i class="bi bi-book" style="margin-right: 6px;"></i>
                        Course Name <span class="required">*</span>
                    </label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-building input-icon"></i>
                        <select name="course" id="course" class="form-select" required>
                            <option value="">Select Course</option>
                            {% for i in course %}
                                <option value="{{ i.id }}" {% if data.COURSE_id == i.id %}selected{% endif %}>
                                    {{ i.course_name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <hr class="form-divider">

                <!-- Submit Button -->
                <div class="button-center">
                    <button type="submit" class="btn-submit">
                        <i class="bi bi-pencil-square"></i>
                        UPDATE SUBJECT
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
{% endblock %}
