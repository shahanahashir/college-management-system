{% extends 'Hod/dashboard.html' %}

{% block page_title %}
<h2 class="dashboard-title">
    <i class="bi bi-shield-lock"></i> Change Password
</h2>
{% endblock %}

{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        .password-wrapper {
            max-width: 550px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .password-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.06);
            padding: 30px 35px 35px 35px;
            border: 1px solid #e9ecef;
        }

        .password-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .password-header .icon-box {
            width: 65px;
            height: 65px;
            background: #2c3e50;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }

        .password-header .icon-box i {
            font-size: 30px;
            color: #ffffff;
        }

        .password-header h4 {
            font-weight: 700;
            color: #2c3e50;
            margin: 0;
            font-size: 22px;
        }

        .password-header p {
            color: #6c757d;
            font-size: 13px;
            margin: 2px 0 0 0;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 5px;
            display: block;
        }

        .form-group label .required {
            color: #dc3545;
        }

        .form-control {
            border-radius: 10px;
            padding: 11px 16px;
            font-size: 14px;
            border: 1.5px solid #dee2e6;
            background: #f8f9fa;
            transition: all 0.2s ease;
            height: 46px;
        }

        .form-control:focus {
            border-color: #2c3e50;
            box-shadow: 0 0 0 3px rgba(44, 62, 80, 0.08);
            background: #ffffff;
        }

        .form-control::placeholder {
            color: #adb5bd;
            font-size: 13px;
        }

        .password-requirements {
            font-size: 12px;
            color: #6c757d;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .password-requirements i {
            color: #adb5bd;
        }

        .btn-change-password {
            width: 100%;
            padding: 13px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            background: #2c3e50;
            border: none;
            color: #ffffff;
            transition: all 0.3s ease;
            margin-top: 6px;
            cursor: pointer;
        }

        .btn-change-password:hover {
            background: #1a2a3a;
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(44, 62, 80, 0.2);
        }

        .btn-change-password:active {
            transform: scale(0.98);
        }

        .btn-change-password i {
            margin-right: 8px;
        }

        .form-control:invalid:not(:placeholder-shown) {
            border-color: #dc3545;
        }

        .form-control:invalid:not(:placeholder-shown):focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 3px rgba(220, 53, 69, 0.08);
        }

        .form-control:valid:not(:placeholder-shown) {
            border-color: #28a745;
        }

        .form-control:valid:not(:placeholder-shown):focus {
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.08);
        }

        @media (max-width: 576px) {
            .password-card {
                padding: 20px 18px 25px 18px;
            }

            .password-header h4 {
                font-size: 19px;
            }

            .password-header .icon-box {
                width: 55px;
                height: 55px;
            }

            .password-header .icon-box i {
                font-size: 24px;
            }

            .form-control {
                height: 42px;
                padding: 9px 12px;
                font-size: 13px;
            }

            .btn-change-password {
                padding: 11px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<div class="password-wrapper">
    <div class="password-card">

        <!-- Header -->
        <div class="password-header">
            <div class="icon-box">
                <i class="bi bi-shield-lock"></i>
            </div>
            <h4>Change Password</h4>
            <p>Update your security credentials</p>
        </div>

        <!-- Form - ALL ORIGINAL ATTRIBUTES PRESERVED -->
        <form method="post" enctype="multipart/form-data" action="/myapp/hod_change_password_post">
            {% csrf_token %}

            <!-- Current Password -->
            <div class="form-group">
                <label for="current_password">
                    Current Password <span class="required">*</span>
                </label>
                <input type="password"
                       class="form-control"
                       id="current_password"
                       placeholder="Enter current password"
                       required
                       oninvalid="this.setCustomValidity('Please enter current password')"
                       oninput="this.setCustomValidity('')"
                       name="current_password">
            </div>

            <!-- New Password -->
            <div class="form-group">
                <label for="new_password">
                    New Password <span class="required">*</span>
                </label>
                <input type="password"
                       class="form-control"
                       id="new_password"
                       placeholder="Enter new password"
                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                       title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"
                       required
                       oninvalid="this.setCustomValidity('Password must contain at least one number, one uppercase and lowercase letter, and be at least 8 characters long')"
                       oninput="this.setCustomValidity('')"
                       name="new_password"
                >
                <div class="password-requirements">
                    <i class="bi bi-info-circle"></i>
                    Must contain at least one number, one uppercase & lowercase letter, and be 8+ characters
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirm_password">
                    Confirm Password <span class="required">*</span>
                </label>
                <input type="password"
                       class="form-control"
                       id="confirm_password"
                       placeholder="Confirm your password"
                       pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                       title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"
                       required
                       oninvalid="this.setCustomValidity('Password must contain at least one number, one uppercase and lowercase letter, and be at least 8 characters long')"
                       oninput="this.setCustomValidity('')"
                       name="confirm_password"
                >
            </div>

            <button type="submit" class="btn-change-password">
                <i class="bi bi-key"></i> Change Password
            </button>

        </form>

    </div>
</div>

<!-- Original Scripts -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- Confirm Password Match Validation -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    var newPassword = document.getElementById('new_password');
    var confirmPassword = document.getElementById('confirm_password');

    function validateMatch() {
        if (confirmPassword.value.length > 0) {
            if (newPassword.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity('Passwords do not match');
            } else {
                confirmPassword.setCustomValidity('');
            }
        } else {
            confirmPassword.setCustomValidity('');
        }
    }

    newPassword.addEventListener('input', validateMatch);
    confirmPassword.addEventListener('input', validateMatch);
});
</script>

</body>
</html>
{% endblock %}
