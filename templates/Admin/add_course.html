{% extends 'Admin/dashboard1.html' %}
{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* ===== PAGE STYLES ===== */
        .course-wrapper {
            padding: 10px 0 30px 0;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .page-header .header-left .icon-circle {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #2c3e50, #1a2a3a);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(44, 62, 80, 0.2);
        }

        .page-header .header-left .icon-circle i {
            font-size: 26px;
            color: white;
        }

        .page-header .header-left .header-text h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a2a3a;
            margin: 0;
            letter-spacing: -0.3px;
        }

        .page-header .header-left .header-text .subtitle {
            font-size: 14px;
            color: #6c757d;
            margin: 0;
        }

        /* ===== FORM CARD ===== */
        .form-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
            overflow: hidden;
            max-width: 780px;
            margin: 0 auto;
            transition: box-shadow 0.3s ease;
        }

        .form-card:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        .form-card .card-header {
            padding: 18px 28px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .form-card .card-header .card-title {
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-card .card-header .card-title i {
            color: #2c3e50;
            font-size: 20px;
        }

        .form-card .card-header .card-title .badge-add {
            background: #28a745;
            color: white;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-card .card-header .timestamp {
            font-size: 13px;
            color: #6c757d;
        }

        .form-card .card-header .timestamp i {
            margin-right: 5px;
        }

        .form-card .card-body {
            padding: 32px 34px 34px 34px;
        }

        /* ===== FORM STYLES ===== */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 6px;
            display: block;
        }

        .form-group label .required {
            color: #dc3545;
            margin-left: 3px;
        }

        .form-group .form-control {
            border-radius: 12px;
            padding: 11px 18px;
            font-size: 14px;
            border: 1.5px solid #dee2e6;
            background: #fafbfc;
            transition: all 0.3s ease;
            color: #2c3e50;
            height: 48px;
            width: 100%;
        }

        .form-group .form-control:hover {
            background: #ffffff;
            border-color: #c8d0d9;
        }

        .form-group .form-control:focus {
            border-color: #2c3e50;
            box-shadow: 0 0 0 4px rgba(44, 62, 80, 0.08);
            background: #ffffff;
            outline: none;
        }

        .form-group .form-control::placeholder {
            color: #adb5bd;
            font-size: 13px;
        }

        .form-group .form-control[type="number"] {
            -moz-appearance: textfield;
        }

        .form-group .form-control[type="number"]::-webkit-outer-spin-button,
        .form-group .form-control[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* ===== TEXTAREA STYLES ===== */
        .form-group .form-control.textarea {
            height: auto;
            min-height: 120px;
            resize: vertical;
            padding: 12px 18px;
            line-height: 1.6;
        }

        /* ===== FORM ICONS ===== */
        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper .form-control {
            padding-left: 46px;
        }

        .input-icon-wrapper .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 19px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .input-icon-wrapper .form-control.textarea ~ .input-icon {
            top: 22px;
            transform: none;
        }

        .input-icon-wrapper .form-control:focus ~ .input-icon {
            color: #2c3e50;
        }

        /* ===== SUBMIT BUTTON ===== */
        .btn-submit {
            padding: 14px 48px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            background: linear-gradient(145deg, #28a745, #218838);
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 16px rgba(40, 167, 69, 0.25);
        }

        .btn-submit:hover {
            background: linear-gradient(145deg, #1e7e34, #19692b);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(40, 167, 69, 0.35);
        }

        .btn-submit:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.2);
        }

        .btn-submit i {
            font-size: 20px;
        }

        /* ===== BUTTON CENTER ===== */
        .button-center {
            text-align: center;
            margin-top: 10px;
            padding-top: 6px;
        }

        /* ===== DIVIDER ===== */
        .form-divider {
            border: none;
            border-top: 1px solid #e9ecef;
            margin: 20px 0 24px 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .form-card .card-body {
                padding: 22px 20px 26px 20px;
            }

            .form-card .card-header {
                padding: 14px 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header .header-left .header-text h2 {
                font-size: 20px;
            }

            .page-header .header-left .icon-circle {
                width: 44px;
                height: 44px;
            }

            .page-header .header-left .icon-circle i {
                font-size: 22px;
            }

            .btn-submit {
                width: 100%;
                justify-content: center;
                padding: 13px 24px;
                font-size: 15px;
            }

            .form-group .form-control {
                height: 44px;
                font-size: 13px;
                padding: 9px 16px;
            }

            .form-group .form-control.textarea {
                min-height: 100px;
            }

            .form-group label {
                font-size: 13px;
            }

            .input-icon-wrapper .form-control {
                padding-left: 42px;
            }

            .input-icon-wrapper .input-icon {
                font-size: 17px;
                left: 14px;
            }

            .form-card .card-header .card-title {
                font-size: 14px;
            }
        }

        @media (max-width: 576px) {
            .form-card .card-body {
                padding: 18px 16px 22px 16px;
            }

            .form-card .card-header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
            }

            .form-group .form-control {
                height: 40px;
                font-size: 12px;
                padding: 7px 14px;
                border-radius: 10px;
            }

            .form-group .form-control.textarea {
                min-height: 90px;
                padding: 10px 14px;
            }

            .btn-submit {
                font-size: 14px;
                padding: 11px 20px;
            }

            .input-icon-wrapper .form-control {
                padding-left: 38px;
            }

            .input-icon-wrapper .input-icon {
                font-size: 15px;
                left: 12px;
            }

            .page-header .header-left .header-text h2 {
                font-size: 18px;
            }

            .page-header .header-left .icon-circle {
                width: 38px;
                height: 38px;
            }

            .page-header .header-left .icon-circle i {
                font-size: 18px;
            }

            .form-card .card-header .timestamp {
                font-size: 11px;
            }
        }

        /* ===== VALIDATION STYLES ===== */
        .form-control:invalid:not(:placeholder-shown) {
            border-color: #dc3545;
        }

        .form-control:invalid:not(:placeholder-shown):focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.08);
        }

        .form-control:valid:not(:placeholder-shown) {
            border-color: #28a745;
        }

        .form-control:valid:not(:placeholder-shown):focus {
            border-color: #28a745;
            box-shadow: 0 0 0 4px rgba(40, 167, 69, 0.08);
        }
    </style>
</head>
<body>

<div class="course-wrapper">

    <!-- ===== PAGE HEADER ===== -->
    <div class="page-header">
        <div class="header-left">
            <div class="icon-circle">
                <i class="bi bi-book-fill"></i>
            </div>
            <div class="header-text">
                <h2>Add Course</h2>
                <p class="subtitle">Create a new course for the department</p>
            </div>
        </div>
    </div>

    <!-- ===== FORM CARD ===== -->
    <div class="form-card">
        <div class="card-header">
            <div class="card-title">
                <i class="bi bi-plus-circle-fill"></i>
                New Course
                <span class="badge-add">ADD NEW</span>
            </div>
            <div class="timestamp">
                <i class="bi bi-clock"></i>
                {% now "d M Y, h:i A" %}
            </div>
        </div>

        <div class="card-body">
            <form method="post" enctype="multipart/form-data" action="/myapp/add_course_post">
                {% csrf_token %}
                <input type="hidden" name="id" value="{{ id }}" required>

                <!-- Course Name -->
                <div class="form-group">
                    <label for="course_name">
                        <i class="bi bi-book" style="margin-right: 6px;"></i>
                        Course Name <span class="required">*</span>
                    </label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-book input-icon"></i>
                        <input type="text" class="form-control" name="course_name"
                               placeholder="Enter course name"
                               required
                               oninvalid="this.setCustomValidity('Please enter course name')"
                               oninput="this.setCustomValidity('')">
                    </div>
                </div>

                <!-- Course Details -->
                <div class="form-group">
                    <label for="course_details">
                        <i class="bi bi-file-text" style="margin-right: 6px;"></i>
                        Course Details <span class="required">*</span>
                    </label>
                    <div class="input-icon-wrapper">
{#                        <i class="bi bi-file-text input-icon"></i>#}
                        <textarea name="course_details" class="form-control textarea"
                                  rows="5"
                                  placeholder="Enter course description, syllabus, or other details"
                                  required
                                  oninvalid="this.setCustomValidity('Please enter course details')"
                                  oninput="this.setCustomValidity('')"></textarea>
                    </div>
                </div>

                <!-- Fee & Total Semester Row -->
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="fee">
                                <i class="bi bi-currency-rupee" style="margin-right: 6px;"></i>
                                Fee <span class="required">*</span>
                            </label>
                            <div class="input-icon-wrapper">
                                <i class="bi bi-currency-rupee input-icon"></i>
                                <input type="number" class="form-control" name="fee"
                                       placeholder="Enter course fee"
                                       min="1"
                                       required
                                       oninvalid="this.setCustomValidity('Please enter fee amount')"
                                       oninput="this.setCustomValidity('')">
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="total_semester">
                                <i class="bi bi-grid-3x3-gap-fill" style="margin-right: 6px;"></i>
                                Total Semester <span class="required">*</span>
                            </label>
                            <div class="input-icon-wrapper">
                                <i class="bi bi-grid-3x3-gap-fill input-icon"></i>
                                <input type="number" class="form-control" name="total_semester"
                                       placeholder="Enter total semesters"
                                       min="1"
                                       required
                                       oninvalid="this.setCustomValidity('Please enter total semesters')"
                                       oninput="this.setCustomValidity('')">
                            </div>
                        </div>
                    </div>
                </div>

                <hr class="form-divider">

                <!-- Submit Button -->
                <div class="button-center">
                    <button type="submit" class="btn-submit">
                        <i class="bi bi-plus-circle-fill"></i>
                        ADD COURSE
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
{% endblock %}
