{% extends 'Admin/dashboard1.html' %}
{% block body %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Notification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* ===== PAGE STYLES ===== */
        .notification-wrapper {
            padding: 10px 0 30px 0;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .page-header .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .page-header .header-left .icon-circle {
            width: 52px;
            height: 52px;
            background: linear-gradient(145deg, #2c3e50, #1a2a3a);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(44, 62, 80, 0.2);
        }

        .page-header .header-left .icon-circle i {
            font-size: 26px;
            color: white;
        }

        .page-header .header-left .header-text h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a2a3a;
            margin: 0;
            letter-spacing: -0.3px;
        }

        .page-header .header-left .header-text .subtitle {
            font-size: 14px;
            color: #6c757d;
            margin: 0;
        }

        /* ===== FORM CARD ===== */
        .form-card {
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            border: 1px solid #e9ecef;
            overflow: hidden;
            max-width: 780px;
            margin: 0 auto;
            transition: box-shadow 0.3s ease;
        }

        .form-card:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        .form-card .card-header {
            padding: 18px 28px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .form-card .card-header .card-title {
            font-weight: 600;
            color: #2c3e50;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-card .card-header .card-title i {
            color: #2c3e50;
            font-size: 20px;
        }

        .form-card .card-header .card-title .badge-add {
            background: #28a745;
            color: white;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .form-card .card-header .timestamp {
            font-size: 13px;
            color: #6c757d;
        }

        .form-card .card-header .timestamp i {
            margin-right: 5px;
        }

        .form-card .card-body {
            padding: 32px 34px 34px 34px;
        }

        /* ===== FORM STYLES ===== */
        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            font-weight: 600;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 6px;
            display: block;
        }

        .form-group label .required {
            color: #dc3545;
            margin-left: 3px;
        }

        .form-group .form-control,
        .form-group .form-select {
            border-radius: 12px;
            padding: 11px 18px;
            font-size: 14px;
            border: 1.5px solid #dee2e6;
            background: #fafbfc;
            transition: all 0.3s ease;
            color: #2c3e50;
            height: 48px;
            width: 100%;
        }

        .form-group .form-control:hover,
        .form-group .form-select:hover {
            background: #ffffff;
            border-color: #c8d0d9;
        }

        .form-group .form-control:focus,
        .form-group .form-select:focus {
            border-color: #2c3e50;
            box-shadow: 0 0 0 4px rgba(44, 62, 80, 0.08);
            background: #ffffff;
            outline: none;
        }

        .form-group .form-control::placeholder {
            color: #adb5bd;
            font-size: 13px;
        }

        .form-group .form-control[type="number"] {
            -moz-appearance: textfield;
        }

        .form-group .form-control[type="number"]::-webkit-outer-spin-button,
        .form-group .form-control[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* ===== FORM ROW ===== */
        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -10px;
        }

        .form-row .form-group {
            padding: 0 10px;
            flex: 0 0 100%;
            max-width: 100%;
        }

        @media (min-width: 768px) {
            .form-row .form-group.half {
                flex: 0 0 50%;
                max-width: 50%;
            }
        }

        /* ===== FORM ICONS ===== */
        .input-icon-wrapper {
            position: relative;
        }

        .input-icon-wrapper .form-control,
        .input-icon-wrapper .form-select {
            padding-left: 46px;
        }

        .input-icon-wrapper .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            font-size: 19px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        .input-icon-wrapper .form-control:focus ~ .input-icon,
        .input-icon-wrapper .form-select:focus ~ .input-icon {
            color: #2c3e50;
        }

        /* ===== DATE VALIDATION MESSAGE ===== */
        .validation-message {
            margin-top: 8px;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
        }

        .validation-message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border-left: 4px solid #28a745;
        }

        .validation-message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid #dc3545;
        }

        .validation-message.warning {
            display: block;
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid #ffc107;
        }

        /* ===== SUBMIT BUTTON ===== */
        .btn-submit {
            padding: 14px 48px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            background: linear-gradient(145deg, #28a745, #218838);
            color: white;
            transition: all 0.3s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 16px rgba(40, 167, 69, 0.25);
        }

        .btn-submit:hover {
            background: linear-gradient(145deg, #1e7e34, #19692b);
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(40, 167, 69, 0.35);
        }

        .btn-submit:active {
            transform: scale(0.97);
            box-shadow: 0 2px 8px rgba(40, 167, 69, 0.2);
        }

        .btn-submit i {
            font-size: 20px;
        }

        /* ===== BUTTON CENTER ===== */
        .button-center {
            text-align: center;
            margin-top: 10px;
            padding-top: 6px;
        }

        /* ===== DIVIDER ===== */
        .form-divider {
            border: none;
            border-top: 1px solid #e9ecef;
            margin: 20px 0 24px 0;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .form-card .card-body {
                padding: 22px 20px 26px 20px;
            }

            .form-card .card-header {
                padding: 14px 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header .header-left .header-text h2 {
                font-size: 20px;
            }

            .page-header .header-left .icon-circle {
                width: 44px;
                height: 44px;
            }

            .page-header .header-left .icon-circle i {
                font-size: 22px;
            }

            .btn-submit {
                width: 100%;
                justify-content: center;
                padding: 13px 24px;
                font-size: 15px;
            }

            .form-group .form-control,
            .form-group .form-select {
                height: 44px;
                font-size: 13px;
                padding: 9px 16px;
            }

            .form-group label {
                font-size: 13px;
            }

            .input-icon-wrapper .form-control,
            .input-icon-wrapper .form-select {
                padding-left: 42px;
            }

            .input-icon-wrapper .input-icon {
                font-size: 17px;
                left: 14px;
            }

            .form-card .card-header .card-title {
                font-size: 14px;
            }
        }

        @media (max-width: 576px) {
            .form-card .card-body {
                padding: 18px 16px 22px 16px;
            }

            .form-card .card-header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
            }

            .form-group .form-control,
            .form-group .form-select {
                height: 40px;
                font-size: 12px;
                padding: 7px 14px;
                border-radius: 10px;
            }

            .btn-submit {
                font-size: 14px;
                padding: 11px 20px;
            }

            .form-row .form-group.half {
                flex: 0 0 100%;
                max-width: 100%;
            }

            .input-icon-wrapper .form-control,
            .input-icon-wrapper .form-select {
                padding-left: 38px;
            }

            .input-icon-wrapper .input-icon {
                font-size: 15px;
                left: 12px;
            }

            .page-header .header-left .header-text h2 {
                font-size: 18px;
            }

            .page-header .header-left .icon-circle {
                width: 38px;
                height: 38px;
            }

            .page-header .header-left .icon-circle i {
                font-size: 18px;
            }

            .form-card .card-header .timestamp {
                font-size: 11px;
            }

            .validation-message {
                font-size: 12px;
                padding: 6px 12px;
            }
        }

        /* ===== VALIDATION STYLES ===== */
        .form-control:invalid:not(:placeholder-shown) {
            border-color: #dc3545;
        }

        .form-control:invalid:not(:placeholder-shown):focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.08);
        }

        .form-control:valid:not(:placeholder-shown) {
            border-color: #28a745;
        }

        .form-control:valid:not(:placeholder-shown):focus {
            border-color: #28a745;
            box-shadow: 0 0 0 4px rgba(40, 167, 69, 0.08);
        }

        /* ===== SELECT ARROW CUSTOM ===== */
        .form-select {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%236c757d' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 14px;
            padding-right: 40px;
            cursor: pointer;
        }

        .form-select:hover {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%232c3e50' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M2 5l6 6 6-6'/%3e%3c/svg%3e");
        }

        /* ===== SECTION TITLE ===== */
        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 18px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f3f5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: #2c3e50;
        }
    </style>
</head>
<body>

<div class="notification-wrapper">

    <!-- ===== PAGE HEADER ===== -->
    <div class="page-header">
        <div class="header-left">
            <div class="icon-circle">
                <i class="bi bi-bell-fill"></i>
            </div>
            <div class="header-text">
                <h2>Add Notification</h2>
                <p class="subtitle">Create a new course fee notification</p>
            </div>
        </div>
    </div>

    <!-- ===== FORM CARD ===== -->
    <div class="form-card">
        <div class="card-header">
            <div class="card-title">
                <i class="bi bi-plus-circle-fill"></i>
                New Notification
                <span class="badge-add">ADD NEW</span>
            </div>
            <div class="timestamp">
                <i class="bi bi-clock"></i>
                {% now "d M Y, h:i A" %}
            </div>
        </div>

        <div class="card-body">
            <form method="post" enctype="multipart/form-data" action="/myapp/add_notification_post" id="dateForm">

                <!-- ===== COURSE INFORMATION ===== -->
                <div class="section-title">
                    <i class="bi bi-book"></i> Course Information
                </div>

                <!-- Course Name -->
                <div class="form-group">
                    <label for="course">
                        <i class="bi bi-book" style="margin-right: 6px;"></i>
                        Course Name <span class="required">*</span>
                    </label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-building input-icon"></i>
                        <select name="course" id="course" class="form-select" required>
                            <option value="">Select Course</option>
                            {% for i in data %}
                                <option value="{{ i.id }}">{{ i.course_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <!-- Semester -->
                <div class="form-group">
                    <label for="semester">
                        <i class="bi bi-grid-3x3-gap-fill" style="margin-right: 6px;"></i>
                        Semester <span class="required">*</span>
                    </label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-grid-3x3-gap-fill input-icon"></i>
                        <select name="semester" id="semester" class="form-select" required>
                            <option value="">Select Semester</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                            <option value="6">6</option>
                        </select>
                    </div>
                </div>

                <!-- ===== DATE INFORMATION ===== -->
                <div class="section-title" style="margin-top: 8px;">
                    <i class="bi bi-calendar3"></i> Date Information
                </div>

                <!-- From Date & Last Date Row -->
                <div class="form-row">
                    <div class="form-group half">
                        <label for="f_date">
                            <i class="bi bi-calendar-event" style="margin-right: 6px;"></i>
                            From Date <span class="required">*</span>
                        </label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-calendar3 input-icon"></i>
                            <input type="date" class="form-control" name="start_date" id="f_date"
                                   required
                                   oninvalid="this.setCustomValidity('Please enter date')"
                                   oninput="this.setCustomValidity('')"
                                   min="{{ new_date }}">
                        </div>
                    </div>

                    <div class="form-group half">
                        <label for="t_date">
                            <i class="bi bi-calendar-x" style="margin-right: 6px;"></i>
                            Last Date <span class="required">*</span>
                        </label>
                        <div class="input-icon-wrapper">
                            <i class="bi bi-calendar3 input-icon"></i>
                            <input type="date" class="form-control" name="last_date" id="t_date"
                                   required
                                   oninvalid="this.setCustomValidity('Please enter date')"
                                   oninput="this.setCustomValidity('')"
                                   min="{{ new_date }}">
                        </div>
                        <div id="result" class="validation-message"></div>
                    </div>
                </div>

                <!-- ===== FEE INFORMATION ===== -->
                <div class="section-title" style="margin-top: 8px;">
                    <i class="bi bi-currency-rupee"></i> Fee Information
                </div>

                <!-- Amount -->
                <div class="form-group">
                    <label for="amount">
                        <i class="bi bi-currency-rupee" style="margin-right: 6px;"></i>
                        Amount <span class="required">*</span>
                    </label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-currency-rupee input-icon"></i>
                        <input type="number" class="form-control" name="amount"
                               placeholder="Enter fee amount"
                               min="1"
                               required
                               oninvalid="this.setCustomValidity('Please enter amount')"
                               oninput="this.setCustomValidity('')">
                    </div>
                </div>

                <!-- Academic Year -->
                <div class="form-group">
                    <label for="academic_year">
                        <i class="bi bi-calendar2-range" style="margin-right: 6px;"></i>
                        Academic Year <span class="required">*</span>
                    </label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-calendar2-range input-icon"></i>
                        <select name="academic_year" id="academic_year" class="form-select" required>
                            <option value="">-- Select Academic Year --</option>
                            {% for year in years %}
                                <option value="{{ year }}-{{ year|add:'1' }}">
                                    {{ year }}-{{ year|add:'1' }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <hr class="form-divider">

                <!-- Submit Button -->
                <div class="button-center">
                    <button type="submit" class="btn-submit">
                        <i class="bi bi-plus-circle-fill"></i>
                        ADD NOTIFICATION
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- ===== DATE VALIDATION SCRIPT ===== -->
<script>
    document.getElementById("dateForm").addEventListener("submit", function(event) {
        const fromDateInput = document.getElementById("f_date").value;
        const toDateInput = document.getElementById("t_date").value;
        const resultEl = document.getElementById("result");

        // Convert to Date objects
        const fromDate = new Date(fromDateInput);
        const toDate = new Date(toDateInput);

        // Validate date parsing
        if (isNaN(fromDate.getTime()) || isNaN(toDate.getTime())) {
            resultEl.textContent = "⚠️ Invalid date format. Please select valid dates.";
            resultEl.className = "validation-message error";
            event.preventDefault();
            return;
        }

        // Compare dates
        if (toDate > fromDate) {
            resultEl.textContent = "✅ Last Date is valid (greater than From Date).";
            resultEl.className = "validation-message success";
        } else if (toDate.getTime() === fromDate.getTime()) {
            resultEl.textContent = "⚠️ Both dates are the same. Last Date should be after From Date.";
            resultEl.className = "validation-message warning";
            event.preventDefault();
        } else {
            resultEl.textContent = "❌ Last Date must be greater than From Date.";
            resultEl.className = "validation-message error";
            event.preventDefault();
        }
    });

    // Real-time validation on date change
    document.getElementById("f_date").addEventListener("change", validateDates);
    document.getElementById("t_date").addEventListener("change", validateDates);

    function validateDates() {
        const fromDateInput = document.getElementById("f_date").value;
        const toDateInput = document.getElementById("t_date").value;
        const resultEl = document.getElementById("result");

        if (!fromDateInput || !toDateInput) {
            resultEl.className = "validation-message";
            return;
        }

        const fromDate = new Date(fromDateInput);
        const toDate = new Date(toDateInput);

        if (isNaN(fromDate.getTime()) || isNaN(toDate.getTime())) {
            return;
        }

        if (toDate > fromDate) {
            resultEl.textContent = "✅ Last Date is valid (greater than From Date).";
            resultEl.className = "validation-message success";
        } else if (toDate.getTime() === fromDate.getTime()) {
            resultEl.textContent = "⚠️ Both dates are the same. Last Date should be after From Date.";
            resultEl.className = "validation-message warning";
        } else {
            resultEl.textContent = "❌ Last Date must be greater than From Date.";
            resultEl.className = "validation-message error";
        }
    }
</script>

</body>
</html>
{% endblock %}
